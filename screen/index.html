<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Message Screen</title>
  <style>
    body { font-family: sans-serif; background: #000; color: #fff; overflow: hidden; }
    #board { width: 100%; height: 100vh; overflow-y: auto; }
    .card { background: rgba(255,255,255,0.1); border-radius: 10px; padding: 1em; margin: 1em; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div id="board"></div>
  <script>
    async function fetchMessages() {
      const res = await fetch('/api/messages');
      const data = await res.json();
      const board = document.getElementById('board');
      board.innerHTML = '';
      data.filter(m => m.approved).forEach(msg => {
        const div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = '<strong>' + msg.nickname + '</strong><p>' + msg.content + '</p>';
        board.appendChild(div);
      });
    }
    fetchMessages();
    setInterval(fetchMessages, 5000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Message Board</title>
  <style>
    body { font-family: sans-serif; padding: 1em; }
  </style>
</head>
<body>
  <h1>Leave a message</h1>
  <form id="msgForm">
    <input type="text" name="nickname" placeholder="Nickname" required><br>
    <textarea name="content" maxlength="100" placeholder="Message..." required></textarea><br>
    <input type="file" name="photo"><br>
    <button type="submit">Submit</button>
  </form>
  <div id="result"></div>

  <script>
    document.getElementById('msgForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch('/api/messages', { method: 'POST', body: formData });
      const data = await res.json();
      if (data.success) {
        document.getElementById('result').textContent = '愿望已送达，感谢你的祝福!';
        e.target.reset();
      } else {
        document.getElementById('result').textContent = data.error || 'Error';
      }
    });
  </script>
</body>
</html>
